services:
  postgres:
    image: postgres:16-alpine
    container_name: edi-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: edi_db
      POSTGRES_USER: edi_user
      POSTGRES_PASSWORD: edi_password

  redis:
    image: redis:7.4-alpine
    container_name: edi-redis
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: edi-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: edi-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
